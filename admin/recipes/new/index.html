<!doctype html>
<html lang="sk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Novy recept</title>
    <link rel="stylesheet" href="/assets/admin.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="page-header">
        <div>
          <p class="eyebrow">Admin</p>
          <h1>Novy recept</h1>
        </div>
        <div class="profile-menu-wrap" data-user-menu hidden></div>
      </header>
      <nav class="app-rail" data-app-nav>
        <a href="/" data-nav="dashboard" aria-label="Dashboard"><span><ion-icon name="home-outline"></ion-icon></span><strong>Domov</strong></a>
        <a href="/inventory/" data-nav="inventory" aria-label="Inventar"><span><ion-icon name="leaf-outline"></ion-icon></span><strong>Inventar</strong></a>
        <a href="/shopping/" data-nav="shopping" aria-label="Nakup"><span><ion-icon name="basket-outline"></ion-icon></span><strong>Nakup</strong></a>
        <a href="/recipes/" data-nav="recipes" class="is-active" aria-label="Recepty"><span><ion-icon name="restaurant-outline"></ion-icon></span><strong>Recepty</strong></a>
      </nav>

      <form id="recipe-form" class="form-stack">
        <section class="panel">
          <h2>Zaklad</h2>
          <div class="grid two">
            <label>
              <span>Nazov</span>
              <input name="title" type="text" required />
            </label>
            <label>
              <span>Obrazok URL</span>
              <input name="image_url" type="url" />
            </label>
          </div>

          <label>
            <span>Popis</span>
            <textarea name="description" rows="4"></textarea>
          </label>

          <div class="grid four">
            <label>
              <span>Porcie</span>
              <input name="servings" type="number" min="0" step="0.5" />
            </label>
            <label>
              <span>Priprava</span>
              <input name="prep_time_minutes" type="number" min="0" step="1" />
            </label>
            <label>
              <span>Varenie</span>
              <input name="cook_time_minutes" type="number" min="0" step="1" />
            </label>
            <label>
              <span>Narocnost</span>
              <select name="difficulty">
                <option value="">Bez hodnoty</option>
                <option value="easy">Lahka</option>
                <option value="medium">Stredna</option>
                <option value="hard">Tazka</option>
              </select>
            </label>
          </div>

          <label class="check-row">
            <input name="is_published" type="checkbox" />
            <span>Publikovany</span>
          </label>
        </section>

        <section class="panel">
          <div class="section-title">
            <h2>Suroviny</h2>
            <button type="button" id="add-ingredient">Pridat surovinu</button>
          </div>
          <div id="ingredients-list" class="rows"></div>
        </section>

        <section class="panel">
          <div class="section-title">
            <h2>Kroky</h2>
            <button type="button" id="add-step">Pridat krok</button>
          </div>
          <div id="steps-list" class="rows"></div>
        </section>

        <footer class="actions">
          <p id="status-message" role="status"></p>
          <button type="submit" class="primary">Ulozit recept</button>
        </footer>
      </form>
    </main>

    <script type="module" src="https://unpkg.com/ionicons@7.4.0/dist/ionicons/ionicons.esm.js"></script>
    <script src="/assets/env.js"></script>
    <script type="module" src="/assets/admin-recipes-new.js"></script>
  </body>
</html>
